name: Visa Appointment Checker

on:
  schedule:
    - cron: '* * * * *'     # يفحص تلقائياً كل دقيقة بصمت في الخلفية
  workflow_dispatch:        # للتشغيل اليدوي الفوري

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install selenium requests

      - name: Multi-Page Reserved Alert Bot
        run: |
          python -c '
          import time
          import re
          import requests
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By

          TELEGRAM_BOT_TOKEN = "9130456398:AAH6OVKEsi2VLnNZ8Evy1milncwb1QyAArc"
          TELEGRAM_CHAT_ID = "5205838156"

          CALENDAR_URLS = [
              "https://appointment.visafg.com/calendar/8?month=2026-12",
              "https://appointment.visafg.com/calendar/7?month=2026-12"
          ]

          def send_telegram_alert(message):
              url = f"https://api.telegram.org/bot{TELEGRAM_BOT_TOKEN}/sendMessage"
              payload = {
                  "chat_id": TELEGRAM_CHAT_ID,
                  "text": message,
                  "parse_mode": "Markdown"
              }
              try:
                  requests.post(url, json=payload, timeout=10)
              except Exception as e:
                  print(f"[-] خطأ في إرسال التنبيه: {e}")

          def check_url(driver, url):
              driver.get(url)
              time.sleep(10)  # انتظار تحميل عناصر الصفحة بالكامل
              body_text = driver.find_element(By.TAG_NAME, "body").text
              match = re.search(r"reserved\D*(\d+)", body_text, re.IGNORECASE)
              return int(match.group(1)) if match else 0

          def main():
              options = Options()
              options.add_argument("--headless")
              options.add_argument("--no-sandbox")
              options.add_argument("--disable-dev-shm-usage")

              driver = webdriver.Chrome(options=options)
              try:
                  for idx, url in enumerate(CALENDAR_URLS, start=1):
                      try:
                          reserved_number = check_url(driver, url)
                          if reserved_number > 0:
                              alert_msg = (
                                  f"🚨 *تنبيه هااام جداً!* 🚨\n\n"
                                  f"✨ *تم رصد تغير بجانب Reserved (العدد: {reserved_number}) في الصفحة رقم {idx} (ديسمبر 2026)!*\n\n"
                                  f"🔗 [اضغط هنا لفتح الصفحة فوراً]({url})"
                              )
                              send_telegram_alert(alert_msg)
                              print(f"[+] تنبيه في الصفحة {idx}: Reserved = {reserved_number}")
                          else:
                              print(f"[-] الصفحة {idx} بصمت: Reserved = 0")
                      except Exception as page_err:
                          print(f"[-] خطأ في فحص الصفحة {idx} ({url}): {page_err}")
              finally:
                  driver.quit()

          if __name__ == "__main__":
              main()
          '
