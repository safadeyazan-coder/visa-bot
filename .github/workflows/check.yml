name: Visa Appointment Checker

on:
  schedule:
    - cron: '* * * * *'     # يعمل تلقائياً كل دقيقة
  workflow_dispatch:        # لتمكين التشغيل اليدوي متى أردت

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install selenium requests

      - name: Smart Reserved Number Alert Bot
        run: |
          python -c '
          import time
          import re
          import requests
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By

          TELEGRAM_BOT_TOKEN = "9130456398:AAH6OVKEsi2VLnNZ8Evy1milncwb1QyAArc"
          TELEGRAM_CHAT_ID = "5205838156"
          CALENDAR_URL = "https://appointment.visafg.com/calendar/8?month=2026-11"

          def send_telegram_alert(message):
              url = f"https://api.telegram.org/bot{TELEGRAM_BOT_TOKEN}/sendMessage"
              for i in range(0, len(message), 4000):
                  chunk = message[i:i+4000]
                  payload = {
                      "chat_id": TELEGRAM_CHAT_ID,
                      "text": chunk,
                      "parse_mode": "Markdown"
                  }
                  try:
                      requests.post(url, json=payload, timeout=10)
                  except Exception as e:
                      print(f"[-] خطأ في إرسال التنبيه: {e}")

          def main():
              options = Options()
              options.add_argument("--headless")
              options.add_argument("--no-sandbox")
              options.add_argument("--disable-dev-shm-usage")
              
              driver = webdriver.Chrome(options=options)
              try:
                  driver.get(CALENDAR_URL)
                  time.sleep(10)  # انتظار تحميل عناصر الصفحة بالكامل
                  
                  body_text = driver.find_element(By.TAG_NAME, "body").text
                  
                  # البحث الذكي عن كلمة reserved والرقَم المجاور لها حصرياً
                  match = re.search(r"reserved\D*(\d+)", body_text, re.IGNORECASE)
                  
                  reserved_number = 0
                  if match:
                      reserved_number = int(match.group(1))
                  
                  # 1. إرسال التقرير الدوري كل دقيقة مع قيمة الـ reserved المرصودة
                  report_msg = f"⏱️ *تقرير الفحص الدوري (كل دقيقة)*:\n📌 الرقم بجانب Reserved حالياً: *{reserved_number}*\n\n📄 *محتوى الصفحة*:\n{body_text[:800]}"
                  send_telegram_alert(report_msg)
                  
                  # 2. إرسال تنبيه هام جداً إذا كان الرقم بجانب كلمة Reserved أكبر من الصفر
                  if reserved_number > 0:
                      alert_msg = f"🚨 *تنبيه هااام جداً!* 🚨\n\n✨ *تم رصد عدد ({reserved_number}) بجانب كلمة Reserved (تغير عن الصفر)!*\n\n🔗 [اضغط هنا لفتح رابط الحجز فوراً]({CALENDAR_URL})"
                      send_telegram_alert(alert_msg)
                      print(f"[+] تم رصد تغيير في رقم Reserved ({reserved_number}) وإرسال التنبيه الهام!")
                  else:
                      print("[-] البوت يعمل: الرقم بجانب Reserved يساوي صفراً حالياً.")
                      
              except Exception as e:
                  err_msg = f"[-] حدث خطأ أثناء الفحص: {e}"
                  send_telegram_alert(err_msg)
              finally:
                  driver.quit()

          if __name__ == "__main__":
              main()
          '
